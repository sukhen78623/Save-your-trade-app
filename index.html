<script>
(function(){
  function show(m){
    try{
      var d=document.getElementById('tj-err');
      if(!d){d=document.createElement('div');d.id='tj-err';
        d.style.cssText='position:fixed;left:0;right:0;top:0;z-index:99999;background:#7a1f1f;color:#fff;padding:12px 14px;font:13px/1.4 system-ui,sans-serif;white-space:pre-wrap;word-break:break-word';
        document.documentElement.appendChild(d);}
      d.textContent='Error: '+m;
    }catch(e){}
  }
  function info(){
    try{
      var out=[],sc=document.getElementsByTagName('script');
      for(var i=0;i<sc.length;i++){
        var t=sc[i].textContent||'';
        if(t.indexOf('const mem'+'Store')>-1){out.push('main script len='+t.length+' tail='+JSON.stringify(t.slice(-40)));}
      }
      return '\n'+out.join(' ')+'\npage len='+document.documentElement.outerHTML.length;
    }catch(x){return ''}
  }
  window.addEventListener('error',function(e){show((e.message||'unknown')+(e.lineno?' (line '+e.lineno+')':'')+info())});
  window.addEventListener('unhandledrejection',function(e){show((e.reason&&e.reason.message)||String(e.reason))});
})();
</script>
<meta name="theme-color" content="#111314">
<title>Save Your Trade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f7f5; --surface:#ffffff; --surface2:#f0f4f1; --line:#dfe6e1;
  --text:#18201a; --muted:#66706a; --faint:#8c968f;
  --green:#4f8f5a; --green-d:#397348; --green-bg:rgba(79,143,90,.10); --green-line:rgba(79,143,90,.30); --on-green:#ffffff;
  --red:#c0392f; --red-d:#a52d25; --red-bg:rgba(192,57,47,.08); --red-line:rgba(192,57,47,.28); --on-red:#ffffff;
  --grey:#8a8f95;
  --nav-bg:rgba(255,255,255,.94); --scrim:rgba(16,17,19,.45);
  --hero-stat:rgba(0,0,0,.035); --hero-stat-line:rgba(0,0,0,.07);
  --shadow:0 1px 2px rgba(16,17,19,.06);
  --shadow-lg:0 10px 28px rgba(16,17,19,.14);
  --mark-a:#57ab5e; --mark-b:#367a3f;
  --heart:#e04376;
  --font:'Roboto',system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;
  --r1:6px; --r2:9px; --r3:12px;
  --side-w:88px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#111314; --surface:#181a1c; --surface2:#1d2022; --line:#2c3033;
  --text:#ecedee; --muted:#9a9fa3; --faint:#737a7f;
  --green:#62a96d; --green-d:#76bd80; --green-bg:rgba(98,169,109,.16); --green-line:rgba(98,169,109,.40); --on-green:#ffffff;
  --red:#c6453b; --red-d:#d9655a; --red-bg:rgba(198,69,59,.13); --red-line:rgba(198,69,59,.30); --on-red:#f3f4f6;
  --grey:#767a7d;
  --nav-bg:rgba(24,26,28,.94); --scrim:rgba(0,0,0,.70);
  --hero-stat:rgba(255,255,255,.05); --hero-stat-line:rgba(255,255,255,.08);
  --shadow:0 1px 2px rgba(0,0,0,.22);
  --shadow-lg:0 10px 28px rgba(0,0,0,.34);
  --mark-a:#57ab5e; --mark-b:#367a3f;
  --heart:#e04376;
  color-scheme:dark;
}}
:root[data-theme=dark]{
  --bg:#111314; --surface:#181a1c; --surface2:#1d2022; --line:#2c3033;
  --text:#ecedee; --muted:#9a9fa3; --faint:#737a7f;
  --green:#62a96d; --green-d:#76bd80; --green-bg:rgba(98,169,109,.16); --green-line:rgba(98,169,109,.40); --on-green:#ffffff;
  --red:#c6453b; --red-d:#d9655a; --red-bg:rgba(198,69,59,.13); --red-line:rgba(198,69,59,.30); --on-red:#f3f4f6;
  --grey:#767a7d;
  --nav-bg:rgba(24,26,28,.94); --scrim:rgba(0,0,0,.70);
  --hero-stat:rgba(255,255,255,.05); --hero-stat-line:rgba(255,255,255,.08);
  --shadow:0 1px 2px rgba(0,0,0,.22);
  --shadow-lg:0 10px 28px rgba(0,0,0,.34);
  --mark-a:#57ab5e; --mark-b:#367a3f;
  --heart:#e04376;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:400 13px/1.5 var(--font);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility}
.big,.mid,.amt,.stat .v,.kv span:last-child,.px b,.pos,.neg,.zero{font-variant-numeric:tabular-nums}
#app{max-width:520px;margin:0 auto;min-height:100vh;min-height:100dvh;position:relative;background:var(--bg)}
@media (min-width:560px){#app{border-left:1px solid var(--line);border-right:1px solid var(--line)}}
.pos{color:var(--green)}.neg{color:var(--red)}.zero{color:var(--grey)}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
input,textarea,select{font:inherit;color:inherit}
svg.ic{flex:none;display:block}
h1,h2,h3,p{margin:0}
h1,h2,h3{letter-spacing:-.01em}
@supports (-webkit-touch-callout:none){input,select,textarea,.sel{font-size:16px!important}}

.screen{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;padding:18px 16px 20px}
.screen.hasnav{padding-bottom:88px}
.grow{flex:1}
.foot{margin-top:28px;text-align:center;color:var(--faint);font-size:12px;line-height:1.7}
.foot .heart{display:inline-block;vertical-align:-2px;margin:0 1px;color:var(--heart)}

.brand{display:flex;flex-direction:column;align-items:center;text-align:center;margin:22px 0 20px}
.logo{width:64px;height:64px;border-radius:14px;display:block;margin-bottom:14px}
.logo svg{display:block;border-radius:14px}
@keyframes tjLine{from{stroke-dashoffset:30}to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:no-preference){
  .tja .tj-line{animation:tjLine .9s .25s ease-out both}
}
.brand h1{font-size:22px;font-weight:500;letter-spacing:-.01em}
.brand p{color:var(--muted);margin-top:4px;font-size:12px;letter-spacing:.02em}
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:var(--r2);padding:3px;margin-bottom:16px}
.seg button{flex:1;padding:9px 0;border-radius:var(--r1);color:var(--muted);font-weight:500;font-size:13px}
.seg button.on{background:linear-gradient(135deg,#5d9d67 0%,#45834f 100%);color:#fff}
.seg.appearance{gap:2px}
.seg.appearance button{display:flex;align-items:center;justify-content:center;gap:5px;padding:7px 0;font-size:11px}
.seg.appearance button svg.ic{width:15px;height:15px}
.field{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r2);padding:0 12px;margin-bottom:10px;color:var(--faint);min-width:0;width:100%}
.field:focus-within{border-color:var(--green);box-shadow:0 0 0 2px var(--green-bg)}
.field:focus-within>svg:first-child{color:var(--green)}
.field>svg.ic{width:18px;height:18px}
.field input,.field select{color:var(--text)}
.field input{flex:1;min-width:0;width:100%;background:none;border:0;outline:0;padding:12px 0;font-size:13px}
.field input::placeholder{color:var(--faint)}
.field .pw-toggle{width:28px;height:28px;display:grid;place-items:center;color:var(--faint);flex:none;border-radius:var(--r1)}
.field .pw-toggle:active{background:var(--surface2)}
.field .pw-toggle svg.ic{width:18px;height:18px}
.field input[type=number]{-moz-appearance:textfield;appearance:textfield}
.field input[type=number]::-webkit-outer-spin-button,.field input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.lbl{color:var(--muted);font-size:12px;font-weight:400;margin:2px 2px 5px}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.two>*{min-width:0}
.two .field{padding:0 10px;gap:0}
.row-between{display:flex;justify-content:space-between;align-items:center;margin:4px 2px 16px}
.check{display:flex;align-items:center;gap:8px;color:var(--text)}
.check input{width:18px;height:18px;accent-color:var(--green)}
.link{color:var(--green-d);text-decoration:underline;text-underline-offset:3px}
.btn{width:100%;min-height:44px;background:linear-gradient(135deg,#5d9d67 0%,#45834f 100%);color:#fff;border:1px solid #43804d;font-weight:500;padding:10px 15px;border-radius:10px;font-size:14px;box-shadow:0 1px 3px rgba(0,0,0,.14);transition:filter .2s,box-shadow .2s}
.btn:active{filter:brightness(.94)}
.btn.danger{background:var(--red);color:var(--on-red);border-color:var(--red-d);box-shadow:none}
.btn.danger:active{background:var(--red-d);filter:none}
.btn.ghost{background:var(--surface);color:var(--text);border:1px solid var(--line);box-shadow:0 1px 2px rgba(28,40,28,.06)}
.btn.ghost:active{background:var(--surface2);filter:none}
.btn.small{width:auto;min-height:36px;padding:7px 13px;font-size:13px;border-radius:10px}
.swap{text-align:center;color:var(--muted);margin-top:18px}
.terms{color:var(--muted);font-size:12px;margin:6px 2px 16px;line-height:1.55}
.err{color:var(--red);margin:0 2px 10px;font-size:13px}

.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:16px}
.top>div:first-child{min-width:0}
.hello{color:var(--muted);font-size:12px}
.name{font-size:18px;font-weight:500;line-height:1.3;letter-spacing:-.01em}
.when{color:var(--muted);font-size:12px;margin-top:2px}
.sync{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r2);padding:8px 12px;font-weight:500;font-size:12px;white-space:nowrap}
.sync.active{background:var(--green-bg);border-color:var(--green-line);color:var(--green-d)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--green);animation:pulse 2s infinite}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r3);padding:16px;margin-bottom:12px}
.card.hero.g{border-color:var(--green-line);background:var(--green-bg)}
.card.hero.r{border-color:var(--red-line);background:var(--red-bg)}
.card.hero.g .pos{color:var(--green-d)}
.card.hero.r .neg{color:var(--red-d)}
.card-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.card-h h2{font-size:14px;font-weight:500;display:flex;align-items:center;gap:8px}
.card-h h2 svg{color:var(--green);width:18px;height:18px}
.big{font-size:28px;font-weight:500;letter-spacing:-.02em;line-height:1.15}
.mid{font-size:18px;font-weight:500}
.k{color:var(--muted);font-size:12px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.stat{background:var(--bg);border:1px solid var(--line);border-radius:var(--r2);padding:9px 11px}
.card.hero .stat{background:var(--hero-stat);border-color:var(--hero-stat-line)}
.stat .v{font-size:15px;font-weight:500;margin-top:2px}
.stat .s{color:var(--muted);font-size:11px}
.range{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;margin-bottom:14px}
.range label{display:block;min-width:0}
.range .full{grid-column:1/-1}
.range span{display:block;color:var(--muted);font-size:12px;margin:0 2px 4px}
.range input,.sel{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:var(--r2);padding:9px 10px;font-size:13px;color:var(--text);min-height:38px;font-family:inherit}
.disc{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.disc .it{background:var(--bg);border:1px solid var(--line);border-radius:var(--r2);padding:12px;display:flex;flex-direction:column;gap:6px}
.disc .it svg{color:var(--muted);width:18px;height:18px}
.disc .it.bad{background:var(--red-bg);border-color:var(--red-line)}
.disc .it.bad svg{color:var(--red)}
.disc .it b{font-size:18px;font-weight:500}
.disc .it.md{grid-column:1/-1}
.disc .ynr{display:flex;align-items:center;flex-wrap:wrap;gap:6px 18px}
.disc .ynr>div{display:flex;align-items:baseline;gap:8px}
.disc .ynr i{width:1px;align-self:stretch;min-height:22px;background:var(--line)}
.disc .it.good{background:var(--green-bg);border-color:var(--green-line)}
.disc .it.good svg{color:var(--green)}
.ov-cols{display:grid;grid-template-columns:1fr;gap:0}
.ov-l{margin:0 0 16px;padding-left:18px;display:flex;flex-direction:column;gap:8px;font-size:14px;line-height:1.5}
.ov-l.good li::marker{color:var(--green)}
.ov-l.bad li::marker{color:var(--red)}
.ov-l .k{list-style:none;margin-left:-18px}
.mis-key{margin:0 0 16px;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:14px;line-height:1.5}
.mis-key li::marker{color:var(--green)}
.mis-key b{font-weight:500}
.mis-l{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.mis-l li{position:relative;padding:12px 12px 12px 30px;background:var(--bg);border:1px solid var(--line);border-radius:var(--r2)}
.mis-l li::before{content:"";position:absolute;left:13px;top:19px;width:7px;height:7px;border-radius:50%;background:var(--red)}
.mis-l .mh{display:flex;align-items:baseline;gap:4px 10px;flex-wrap:wrap;font-size:14px}
.mis-l .mh b{font-weight:500}
.mis-l .mh .mc{color:var(--muted);font-size:13px}
.mis-l .mh .mp{margin-left:auto;font-size:13px}
.mis-l .mt{color:var(--muted);font-size:13px;margin-top:4px;line-height:1.5}
.empty{color:var(--muted);text-align:center;padding:14px 6px}
.empty svg.ic{display:block;margin:0 auto 8px;opacity:.75}
.textbtn{color:var(--green-d);font-weight:500;font-size:12px;display:flex;align-items:center;gap:2px}
.textbtn svg.ic{width:16px;height:16px}

.trade{display:flex;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.trade:first-child{border-top:0;padding-top:0}
.bar3{width:3px;align-self:stretch;border-radius:2px;flex:none}
.gbg{background:var(--green)}.rbg{background:var(--red)}.nbg{background:var(--grey)}
.trade .tl{flex:1;min-width:0}
.trade .d{font-weight:500;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
@media (max-width:767px){.trade .d b{flex:0 0 100%;min-width:0;overflow-wrap:anywhere}}
.trade .px{color:var(--muted);font-size:12px;margin-top:2px}
.trade .px b{color:var(--text);font-weight:500}
.trade .tr{text-align:right}
.trade .amt{font-weight:500;font-size:14px}
.trade .sub{color:var(--muted);font-size:11px}
.pill{border:1px solid var(--line);background:var(--bg);border-radius:var(--r1);padding:0 7px;font-size:11px;color:var(--muted);font-weight:500;line-height:18px}
.pill.bk{color:var(--green-d);background:var(--green-bg);border-color:var(--green-line)}
.tag{color:var(--muted);font-size:11px}
.editb{width:38px;height:38px;border-radius:var(--r2);background:var(--bg);border:1px solid var(--line);display:grid;place-items:center;color:var(--green);flex:none}
.addb{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#5d9d67 0%,#45834f 100%);border:1px solid #43804d;display:grid;place-items:center;color:#fff;flex:none;box-shadow:0 1px 3px rgba(0,0,0,.14)}
.addb:active{filter:brightness(.94)}
.titlerow{display:flex;align-items:center;justify-content:space-between;margin:2px 0 14px}
.titlerow .title{margin:0}
.delrow{margin-top:14px}
.pill.mn{color:var(--muted);background:var(--surface2);border-color:var(--line)}
.editb svg.ic{width:18px;height:18px}
.pagecard{padding:4px 16px}
.pagecard .trade:first-child{padding-top:12px}
.title{font-size:20px;font-weight:500;letter-spacing:-.01em;margin:2px 0 14px}
.pager{display:flex;align-items:center;justify-content:space-between;margin:4px 0 14px}
.pager button:disabled{opacity:.4;cursor:default}

.bnav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;background:var(--nav-bg);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;padding:6px 8px calc(6px + env(safe-area-inset-bottom));z-index:20}
.bnav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted);font-size:11px;font-weight:500;padding:2px 0}
.bnav button .ico{width:48px;height:28px;border-radius:var(--r2);display:grid;place-items:center}
.bnav button.on{color:var(--green-d)}
.bnav button.on .ico{background:var(--green-bg)}

.shell{display:block}
.side{display:none}
.main{min-width:0}

.bar{display:flex;align-items:center;gap:8px;margin:-2px 0 16px}
.bar .bk{width:36px;height:36px;border-radius:var(--r2);display:grid;place-items:center;background:var(--surface);border:1px solid var(--line)}
.bar h1{font-size:16px;font-weight:500}
.sec{color:var(--muted);font-size:11px;font-weight:500;margin:18px 2px 6px}
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r3);overflow:hidden}
.li{display:flex;align-items:center;gap:12px;padding:14px;width:100%;text-align:left;border-top:1px solid var(--line);font-size:13px}
.li:active{background:var(--surface2)}
.li:first-child{border-top:0}
.li>svg.ic{width:18px;height:18px}
.li svg:first-child{color:var(--green)}
.li .grow{flex:1}
.li .r{color:var(--muted);display:flex;align-items:center;gap:6px;font-size:12px}
.li .lsub{display:flex;align-items:center;gap:7px;color:var(--green-d);font-size:12px;font-weight:500;margin-top:2px}
.field select{margin-left:-4px}
.li svg:last-child{color:var(--faint)}
.li.danger{color:var(--red)}
.li.danger svg:first-child{color:var(--red)}
.doc p{color:var(--text);margin-bottom:10px;line-height:1.65}
.note{color:var(--muted);font-size:12px}

.kv{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.kv:first-of-type{border-top:0}
.kv span:first-child{color:var(--muted)}
.kv span:last-child{font-weight:500;text-align:right}
.hd{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:500;margin-bottom:10px}
.hd svg{color:var(--green);width:18px;height:18px}
.yn{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-top:1px solid var(--line)}
.yn:first-of-type{border-top:0}
.yn .seg2{display:flex;gap:6px}
.yn .seg2 button{min-width:56px;padding:7px 0;border-radius:var(--r2);border:1px solid var(--line);color:var(--muted);font-weight:500;font-size:12px;background:var(--surface)}
.yn .seg2 button.on{color:var(--on-green)}
.yn .seg2 button.on[data-v=yes]{background:var(--red);border-color:var(--red);color:var(--on-red)}
.yn .seg2 button.on[data-v=no]{background:var(--green);border-color:var(--green)}
.yn.good .seg2 button.on[data-v=yes]{background:var(--green);border-color:var(--green);color:var(--on-green)}
.yn.good .seg2 button.on[data-v=no]{background:var(--red);border-color:var(--red);color:var(--on-red)}
textarea.ta{width:100%;min-height:96px;resize:vertical;background:var(--surface);border:1px solid var(--line);border-radius:var(--r2);padding:10px 12px;outline:0;font-size:13px;color:var(--text)}
textarea.ta::placeholder{color:var(--faint)}
textarea.ta:focus{border-color:var(--green);box-shadow:0 0 0 2px var(--green-bg)}
.shot{display:flex;align-items:center;gap:12px;margin-top:4px}
.shot img{width:72px;height:72px;object-fit:cover;border-radius:var(--r2);border:1px solid var(--line)}
.fileb{display:inline-flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r2);padding:9px 12px;font-weight:500;cursor:pointer}

/* ---------- TABLET (768px and up): left rail + 2-column dashboard ---------- */

  .agrid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px;align-items:stretch}
  .agrid>.card{margin:0}
  .a-range{grid-column:1/-1;grid-row:1}
  .a-net{grid-column:1/8;grid-row:2}
  .a-win{grid-column:8/13;grid-row:2}
  .a-prof{grid-column:1/7;grid-row:6}
  .a-most{grid-column:7/13;grid-row:6}
  .a-day{grid-column:1/-1;grid-row:7}
  .a-disc{grid-column:1/-1;grid-row:3}
  .a-all{grid-column:1/-1;grid-row:4}

  .a-disc .disc{grid-template-columns:repeat(5,minmax(0,1fr))}
  .a-win svg{max-width:100%;height:auto}

  .setwrap{max-width:640px}

  /* sheets become centred dialogs */
  .ov{align-items:center;padding:24px}
  .sheet{max-width:440px;border-radius:var(--r3);padding:20px}

  /* login / signup */
  #app.noshell .screen{max-width:640px;margin:0 auto}
  #app.noshell .screen.auth{max-width:460px;justify-content:center}
  #app.noshell .screen.auth .grow{flex:0 0 auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r3);padding:8px 28px 28px}
}

}

    getItem:function(k){
      if(get(k+'.0')!==null){
        var all='',c;
        for(var i=0;(c=get(k+'.'+i))!==null;i++)all+=c;
        try{return dec(all)}catch(e){return null}
      }
      var old=lsGet(k);
      if(old!==null){api.setItem(k,old)}
      return old;
    },
    setItem:function(k,v){
      var s=enc(String(v)),parts=[];
      for(var i=0;i<s.length;i+=SIZE)parts.push(s.slice(i,i+SIZE));
      for(var j=0;j<parts.length;j++)put(k+'.'+j,parts[j],MAXAGE);
      clearCookie(k,parts.length);
      if(get(k+'.0')===parts[0]){lsDel(k)}else{lsSet(k,v)}
    },
    removeItem:function(k){clearCookie(k);lsDel(k)}
  };
  return api;

function gSetup(){

    r.instrument ?? r.displayName ?? r.display_name ?? ''

};

});

const MONTH_PERIODS=[['this','This Month'],['lastmonth','Last Month'],['custom','Custom Date Range']];
const DISC_PERIODS=[['today','Today'],['thisweek','This Week'],['this','This Month'],['lastweek','Last Week'],['lastmonth','Last Month'],['custom','Custom Date Range']];
const TRADE_PERIODS=[['today','Today'],['thisweek','This Week'],['this','This Month'],['lastweek','Last Week'],['lastmonth','Last Month'],['custom','Custom Date Range']];
const defRange=k=>({mode:(k==='monthly'||k==='discipline'||k==='analytics')?'this':'today',from:monthStart(),to:today()});
const RKEYS=['monthly','discipline','trades','analytics'];
const initR=()=>Object.fromEntries(RKEYS.map(k=>[k,defRange(k)]));
function rangeOf(k){
  const r=S.R[k],d=new Date();
  if(r.mode==='all')return {from:'',to:''};
  if(r.mode==='today')return {from:today(),to:today()};
  if(r.mode==='thisweek'){
    const back=(d.getDay()+6)%7;
    const mon=new Date(d);mon.setDate(d.getDate()-back);
    const sun=new Date(mon);sun.setDate(mon.getDate()+6);
    return {from:iso(mon),to:iso(sun)};
  }
  if(r.mode==='this')return {from:monthStart(),to:monthEnd()};
  if(r.mode==='lastmonth')return {from:iso(new Date(d.getFullYear(),d.getMonth()-1,1)),to:iso(new Date(d.getFullYear(),d.getMonth(),0))};
  if(r.mode==='lastweek'){
    const back=(d.getDay()+6)%7;
    const mon=new Date(d);mon.setDate(d.getDate()-back-7);
    const sun=new Date(mon);sun.setDate(mon.getDate()+6);
    return {from:iso(mon),to:iso(sun)};
  }
  return {from:r.from||'',to:r.to||''};
}
const inR=(k,t)=>{const r=rangeOf(k);return (!r.from||t.date>=r.from)&&(!r.to||t.date<=r.to)};
const emptyMsg=()=>S.tradesLoading?'Loading…':(S.connected||S.trades.length)?`${I('sad',40)}<div>No data available</div>`:'Connect with broker to fetch data';
function filterUI(k){
  const r=S.R[k];
  const wide=(k==='trades'||k==='analytics');
  const opts=k==='monthly'?MONTH_PERIODS:k==='discipline'?DISC_PERIODS:TRADE_PERIODS;
  return `<div class="range${wide?' wide':''}">
    <label class="full"><span>Period</span><select class="sel" data-per="${k}">${opts.map(([v,l])=>`<option value="${v}" ${r.mode===v?'selected':''}>${l}</option>`).join('')}</select></label>
    ${r.mode==='custom'?`
    <label><span>From</span><input type="date" data-rng="${k}" data-side="from" value="${r.from}" ${r.to?`max="${r.to}"`:''}></label>
    <label><span>To</span><input type="date" data-rng="${k}" data-side="to" value="${r.to}" ${r.from?`min="${r.from}"`:''}></label>`:''}
  </div>`;
}

function applyTheme(){
  const r=document.documentElement;
  if(S.theme==='light'||S.theme==='dark')r.setAttribute('data-theme',S.theme);else r.removeAttribute('data-theme');
  const m=document.querySelector('meta[name=theme-color]');
  if(m)m.setAttribute('content',getComputedStyle(r).getPropertyValue('--bg').trim()||'#111314');

}

    id:r.id,broker:r.broker||'',date:r.trade_date,time:r.trade_time||'',side:r.side,
    entry:+r.entry_price,exit:+r.exit_price,qty:+r.qty,

function tradesQuery(){
  return sb.from('trades').select(TRADE_COLS)
    .order('trade_date',{ascending:false}).order('trade_time',{ascending:false}).order('id',{ascending:false});
}
async function loadTrades(){
  const step=1000;
  /* Fetch page 1 with an exact count, then fetch every remaining page in parallel
     instead of one-after-another (this is what makes accounts with lots of trades load fast) */
  let first=await tradesQuery().select(TRADE_COLS,{count:'exact'}).range(0,step-1);
  if(first.error&&/maintain_discipline/.test(first.error.message||'')){TRADE_COLS=TRADE_BASE;S.noMD=true;first=await tradesQuery().select(TRADE_COLS,{count:'exact'}).range(0,step-1)}
  if(first.error)throw first.error;
  const all=first.data.slice();
  const total=typeof first.count==='number'?first.count:all.length;
  if(total>step){
    const pages=[];
    for(let from=step;from<total;from+=step)pages.push(tradesQuery().range(from,from+step-1));
    const results=await Promise.all(pages);
    for(const r of results){if(r.error)throw r.error;all.push(...r.data);}
  }
  S.trades=all.map(dbToTrade);
}
/* Mirrors what the database's subscription_status() function decides, purely for display.
   The actual access control happens server-side (RLS), so a user tampering with this
   in devtools cannot get to their journal data - the database will still refuse it. */
function daysBetween(endMs,nowMs){
  const end=new Date(endMs);end.setHours(0,0,0,0);
  const now=new Date(nowMs);now.setHours(0,0,0,0);
  return Math.round((end-now)/86400000);
}
function computeSubStatus(row){
  const now=Date.now();
  const subEnd=row&&row.subscription_ends_at?new Date(row.subscription_ends_at).getTime():0;
  const trialEnd=row&&row.trial_ends_at?new Date(row.trial_ends_at).getTime():0;
  if(subEnd&&subEnd>now)return{status:'active',daysLeft:Math.max(1,daysBetween(subEnd,now))};
  if(trialEnd&&trialEnd>now)return{status:'trial',daysLeft:Math.max(1,daysBetween(trialEnd,now))};
  return{status:'expired',daysLeft:0};
}
async function loadAll(session){
  const u=session.user;
  S.connected=false;S.broker=null;
  /* Start all four requests together instead of one after another (this is what makes login fast) */
  const pProfile=sb.from('profiles').select('*').eq('id',u.id).maybeSingle().then(r=>r.data,()=>null);
  const pPlan=sb.from('user_profiles').select('plan,trial_ends_at,subscription_ends_at').eq('id',u.id).maybeSingle().then(r=>r.data,()=>null);
  const pBroker=refreshBroker();
  const [p,pr]=await Promise.all([pProfile,pPlan,pBroker]);
  const m=u.user_metadata||{};
  S.profHasGender=!!(p&&Object.prototype.hasOwnProperty.call(p,'gender'));
  let plan='free';
  if(pr&&pr.plan)plan=String(pr.plan).toLowerCase();
  S.subscriptionPlan=plan;
  S.trialEndsAt=(pr&&pr.trial_ends_at)||null;
  S.subscriptionEndsAt=(pr&&pr.subscription_ends_at)||null;
  const st=computeSubStatus(pr);
  S.subStatus=st.status;S.subDaysLeft=st.daysLeft;
  S.user={id:u.id,first:(p&&p.first_name)||m.first_name||'',last:(p&&p.last_name)||m.last_name||'',gender:String((p&&p.gender)||m.gender||'').toLowerCase(),dob:(p&&p.dob)||m.dob||'',email:u.email||'',plan:plan};
  S.acct=S.user;
  S.trades=[];
  /* Trade history can be large, so it no longer blocks login: the dashboard opens right away
     and the trade list fills in a moment later, re-rendering once it's ready */
  S.tradesLoading=true;
  loadTrades().catch(e=>{S.trades=[];console.error(e)}).then(()=>{S.tradesLoading=false;render(true)});
}

function friendlyError(e){
  const m=(e&&e.message)||'Something went wrong';
  if(/email not confirmed|email_not_confirmed/i.test(m))return 'Please confirm your email from the link we sent you, then login';
  if(/invalid login/i.test(m))return 'Wrong email or password';
  if(/already registered/i.test(m))return 'This email is already registered. Please login';
  if(/rate limit/i.test(m))return 'Too many attempts. Please wait a few minutes and try again';
  if(/only request this after|security purposes/i.test(m))return 'Please wait a minute before asking for another link';
  if(/failed to fetch|network/i.test(m))return 'No internet connection. Please try again';
  return m;
}
/* Google login on an account that was first registered with email + password:
   show "already registered" and sign this Google session out (other devices stay logged in) */
const MSG_EMAIL_ACCOUNT='This email is already registered with a password. Please login using your email and password.';
function jwtAmr(t){try{let p=String(t||'').split('.')[1].replace(/-/g,'+').replace(/_/g,'/');while(p.length%4)p+='=';const j=JSON.parse(atob(p));return Array.isArray(j.amr)?j.amr:[]}catch(e){return []}}
function googleOnEmailAccount(sess){
  try{
    const u=sess&&sess.user;if(!u)return false;
    const amr=jwtAmr(sess.access_token).slice().sort((a,b)=>(b.timestamp||0)-(a.timestamp||0));
    if(!amr.length||amr[0].method!=='oauth')return false;
    const ids=u.identities||[];
    const em=ids.find(i=>i.provider==='email'),go=ids.find(i=>i.provider==='google');
    if(!em||!go||!em.created_at||!go.created_at)return false;
    return new Date(em.created_at)<new Date(go.created_at);
  }catch(e){return false}
}
async function initSession(){
  if(!sb){S.error='App could not connect. Please reload';return render();}
  S.busy='Loading';render();
  try{
    try{
      const hash=window.location.hash||'';
      const params=new URLSearchParams(hash.replace(/^#/,''));
      const packed=params.get('syt_session');
      if(packed){
        const b64=packed.replace(/-/g,'+').replace(/_/g,'/');
        const padded=b64+'==='.slice((b64.length+3)%4);
        const data=JSON.parse(atob(padded));
        if(data&&data.a&&data.r){
          await sb.auth.setSession({access_token:data.a,refresh_token:data.r});
          history.replaceState(null,'',window.location.pathname+window.location.search);
        }
      }
    }catch(e){console.error('Session transfer failed',e)}
    await handleGoogleReturn();
    const {data}=await sb.auth.getSession();
    if(data&&data.session){
      if(IS_RECOVERY){
        S.authMode='reset';S.form={};S.error='';
      }else if(googleOnEmailAccount(data.session)){
        try{await sb.auth.signOut({scope:'local'})}catch(e){console.error(e)}
        S.authMode='login';S.error=MSG_EMAIL_ACCOUNT;
      }else{await loadAll(data.session);S.tab='dashboard';}
    }else if(HASH_ERR){
      S.error='This email link is invalid or has expired. To reset your password, tap Forget password and ask for a new link.';
      try{history.replaceState(null,'',window.location.pathname+window.location.search)}catch(e){}
    }
  }catch(e){console.error(e)}
  S.busy=null;render(true);
  if(S.user)handleBrokerReturn();
}

const sorted=l=>[...l].sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time));
function stats(list){
  const total=list.reduce((s,t)=>s+pnl(t),0);
  const w=list.filter(t=>pnl(t)>0).length,l=list.filter(t=>pnl(t)<0).length;
  const gp=list.reduce((s,t)=>{const p=pnl(t);return s+(p>0?p:0)},0);
  const gl=list.reduce((s,t)=>{const p=pnl(t);return s+(p<0?-p:0)},0);
  const pf=gl>0?gp/gl:(gp>0?Infinity:0);
  const days={};list.forEach(t=>days[t.date]=(days[t.date]||0)+pnl(t));
  const dk=Object.keys(days);
  let best=null,worst=null;
  dk.forEach(k=>{if(days[k]>0&&(!best||days[k]>days[best]))best=k;if(days[k]<0&&(!worst||days[k]<days[worst]))worst=k});
  return {total,w,l,rate:(w+l)?Math.round(w/(w+l)*100):0,best:best?{d:best,v:days[best]}:null,worst:worst?{d:worst,v:days[worst]}:null,days,gp,gl,pf};
}
const pfStr=v=>v===Infinity?'∞':v.toFixed(2);
const moneyShort=v=>{
  const a=Math.abs(Math.round(v));
  const s=a>=1000000?(a/1000000).toFixed(1).replace(/\.0$/,'')+'M':a>=1000?(a/1000).toFixed(1).replace(/\.0$/,'')+'k':String(a);
  return (v>0?'+':v<0?'−':'')+'₹'+s;
};

async function sendReset(){
  if(!sb){S.error='App could not connect. Please reload';return render();}
  const email=String(S.form.email||'').trim().toLowerCase();
  if(!/^\S+@\S+\.\S+$/.test(email)){S.error='Enter your registered email address';S.info='';return render()}
  S.error='';S.info='';S.busy='Sending link';render();
  try{
    const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:window.location.href.split('#')[0].split('?')[0]});
    S.busy=null;
    if(error){S.error=friendlyError(error);return render()}
    S.info='If this email is registered, a reset link has been sent. Please check your inbox and spam folder.';
    render();
  }catch(e){S.busy=null;S.error=friendlyError(e);render()}
}
async function saveReset(){
  if(!sb){S.error='App could not connect. Please reload';return render();}
  const f=S.form;
  if(!f.npw||!f.ncf){S.error='Fill in both password fields';return render()}
  if(f.npw.length<8){S.error='Password needs at least 8 characters';return render()}
  if(f.npw!==f.ncf){S.error='Passwords do not match';return render()}
  S.error='';S.busy='Updating password';render();
  try{
    const up=await sb.auth.updateUser({password:f.npw});
    if(up.error){S.busy=null;S.error=friendlyError(up.error);return render()}
    const {data}=await sb.auth.getSession();
    S.form={};S.info='';S.authMode='login';
    if(data&&data.session){await loadAll(data.session);S.tab='dashboard';S.busy=null;render(true);toast('Password updated');return}
    S.busy=null;render(true);
  }catch(e){console.error(e);S.busy=null;S.error=friendlyError(e);render()}
}

function tradesPage(){
  const list=sorted(S.trades.filter(t=>inR('trades',t)));

function smooth(p){
  if(p.length<2)return '';
  let d=`M${p[0][0]},${p[0][1]}`;
  for(let i=0;i<p.length-1;i++){
    const p0=p[i-1]||p[i],p1=p[i],p2=p[i+1],p3=p[i+2]||p2;
    d+=` C${p1[0]+(p2[0]-p0[0])/6},${p1[1]+(p2[1]-p0[1])/6} ${p2[0]-(p3[0]-p1[0])/6},${p2[1]-(p3[1]-p1[1])/6} ${p2[0]},${p2[1]}`;
  }
  return d;
}

    <text x="${bx+w/2}" y="${by+15}" text-anchor="middle" fill="var(--text)" font-size="11" font-weight="600" font-family="Roboto,sans-serif">${label}</text></g>`;
}

function shiftMonth(ym,delta){
  const [y,m]=(ym||today().slice(0,7)).split('-').map(Number);
  const d=new Date(y,m-1+delta,1);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
}

function dayWise(){
  const L=S.trades.filter(t=>inR('analytics',t));
  if(!L.length)return `<div class="empty">${emptyMsg()}</div>`;
  const names=['Monday','Tuesday','Wednesday','Thursday','Friday'];
  const d=names.map(()=>({n:0,w:0,l:0}));
  L.forEach(t=>{
    const wd=new Date(String(t.date).slice(0,10)+'T00:00:00Z').getUTCDay();
    if(wd<1||wd>5)return;
    const x=d[wd-1],p=pnl(t);
    x.n++;if(p>0)x.w++;else if(p<0)x.l++;
  });
  const rows=d.map((x,i)=>({name:names[i],n:x.n,w:x.w,l:x.l}));
  const valid=rows.filter(r=>r.n>0);
  if(!valid.length)return `<div class="empty">${emptyMsg()}</div>`;
  /* Real win rate per weekday: won trades / (won+lost) trades, ties excluded from the denominator — same definition the app uses everywhere else (see stats()). Bar width and color both follow this one number, so a 56% bar is never shown red. */
  valid.forEach(r=>{r.rate=(r.w+r.l)?Math.round(r.w/(r.w+r.l)*100):0});
  let hi=valid[0],lo=valid[0];
  valid.forEach(r=>{if(r.rate>hi.rate)hi=r;if(r.rate<lo.rate)lo=r});
  const both=valid.length>1&&hi.rate!==lo.rate;
  const col=r=>r.rate>=50?'var(--green)':'var(--red)';
  return `<div class="bars">${rows.map((r,i)=>{
    const v=valid.find(x=>x.name===r.name);
    return !v
    ?`<div class="bar-i"><div class="top2"><span>${r.name}</span><b class="zero">–</b></div><div class="track"><i style="width:0"></i></div></div>`
    :`<div class="bar-i"><div class="top2"><span>${r.name} <span style="color:var(--muted)">• ${v.n} ${v.n===1?'trade':'trades'}</span></span><b data-count="${v.rate}" data-fmt="pct">0%</b></div><div class="track"><i style="width:${Math.max(3,v.rate)}%;background:${col(v)};animation-delay:${i*110}ms"></i></div></div>`;
  }).join('')}</div>
  ${both?`<div class="legend"><div><span class="sw" style="background:${col(hi)}"></span>Highest <b>${hi.name} ${hi.rate}%</b></div><div><span class="sw" style="background:${col(lo)}"></span>Lowest <b>${lo.name} ${lo.rate}%</b></div></div>`:''}`;
}

  const L=S.trades.filter(t=>t.date===today());
  const yes=k=>L.filter(t=>t[k]==='yes').length;
  const D={notMaintained:L.filter(t=>t.maintain==='no').length,maintained:yes('maintain'),ruleBreak:yes('ruleBreak'),anticipation:yes('anticipation'),revenge:yes('revenge'),overTrading:yes('overTrading')};
  if(!L.length)return {n:0,D,score:null};
  const scores=L.map(tradeDiscScore);
  let score=Math.round(scores.reduce((a,b)=>a+b,0)/scores.length);
  /* Revenge trading is the one mistake severe enough that no amount of other clean trades should be allowed to average it away — even a single revenge trade today pins the day at High Risk. */
  if(D.revenge>0)score=Math.min(score,34);
  return {n:L.length,D,score};
}
function disciplineGauge(){
  const {n,D,score}=todayDiscData();
  const L=S.trades.filter(t=>t.date===today());
  const tradesWithMistake=L.filter(t=>t.anticipation==='yes'||t.ruleBreak==='yes'||t.overTrading==='yes'||t.revenge==='yes').length;
  const tier=score!=null?riskTier(score):null;
  const tcol=t=>t.cls==='g'?'var(--green)':t.cls==='a'?'#d9a441':'var(--red)';
  const r=76,cx=100,cy=100;
  const pt=v=>{const a=Math.PI*(1-v/100);return [cx+r*Math.cos(a),cy-r*Math.sin(a)]};
  const [sx,sy]=pt(0),[ex,ey]=pt(100);
  const fg=score!=null?(()=>{const [fx,fy]=pt(score);const len=Math.max(0.001,Math.PI*r*score/100);return `<path d="M${sx},${sy} A${r},${r} 0 0 1 ${fx},${fy}" fill="none" stroke="${tcol(tier)}" stroke-width="16" stroke-linecap="round" stroke-dasharray="${len}" stroke-dashoffset="${len}" class="gauge-fg"/>`})():'';
  const svg=`<svg width="220" height="140" viewBox="0 0 200 120" style="max-width:100%;height:auto" role="img" aria-label="Discipline score gauge">
    <path d="M${sx},${sy} A${r},${r} 0 0 1 ${ex},${ey}" fill="none" stroke="var(--line)" stroke-width="16" stroke-linecap="round"/>
    ${fg}
    <text x="100" y="82" text-anchor="middle" fill="var(--text)" font-size="34" font-weight="700" font-family="Roboto,sans-serif" class="gauge-num" ${score!=null?`data-target="${score}"`:''}>${score!=null?0:'–'}</text>
    <text x="100" y="102" text-anchor="middle" fill="var(--muted)" font-size="12" font-family="Roboto,sans-serif">Discipline Score</text>
    <text x="${sx}" y="116" text-anchor="middle" fill="var(--muted)" font-size="10" font-family="Roboto,sans-serif">0</text>
    <text x="${ex}" y="116" text-anchor="middle" fill="var(--muted)" font-size="10" font-family="Roboto,sans-serif">100</text>
  </svg>`;
  const statusNote=!n
    ?`<div class="k" style="text-align:center;margin-top:-6px">No trades logged today</div>`
    :`<div class="k" style="text-align:center;margin-top:-6px">Status: <b style="color:${tcol(tier)}">${tier.label}</b></div>`;
  return `<div class="card d-discscore">
    <div class="card-h"><h2>${I('shield',22)}Discipline Tracker</h2></div>
    <div class="k" style="margin:-6px 0 14px">Based on today's trades</div>
    <div style="display:flex;justify-content:center">${svg}</div>
    ${statusNote}
    <div class="stats" style="margin-top:14px">
      <div class="stat"><div class="k">Not maintained</div><div class="v ${D.notMaintained?'neg':'zero'}">${D.notMaintained}</div></div>
      <div class="stat"><div class="k">Trades with mistakes</div><div class="v ${tradesWithMistake?'neg':'zero'}">${tradesWithMistake}/${n}</div></div>
      <div class="stat"><div class="k">Discipline followed</div><div class="v ${D.maintained?'pos':'zero'}">${D.maintained}/${n}</div></div>
      <div class="stat"><div class="k">Risk tier</div><div class="v" style="${score!=null?`color:${tcol(tier)}`:''}">${score!=null?tier.label:'–'}</div></div>
    </div>
    <div class="k" style="margin-top:12px">This score reflects your trading activity and behaviour for today. It is intended solely to support your growth as a trader, not to judge or criticise you.</div>
  </div>`;
}

function toast(msg){

function animateGaugeNum(){
  document.querySelectorAll('.gauge-num[data-target]').forEach(el=>{
    const target=+el.dataset.target;if(!isFinite(target))return;
    const dur=800,start=performance.now();
    const step=now=>{
      const p=Math.min(1,(now-start)/dur);
      const eased=1-Math.pow(1-p,3);
      el.textContent=Math.round(eased*target);
      if(p<1)requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  });
}
function animateCountUp(root){
  const scoped=!!root;
  (root||document).querySelectorAll('[data-count]').forEach(el=>{
    if(!scoped&&el.closest('.scroll-anim'))return;
    const target=+el.dataset.count;if(!isFinite(target))return;
    const fmt=el.dataset.fmt||'int',dur=1400,start=performance.now();
    const paint=v=>{el.textContent=fmt==='pct'?Math.round(v)+'%':fmt==='money'?money(Math.round(v)):Math.round(v)};
    const step=now=>{
      const p=Math.min(1,(now-start)/dur);
      const eased=1-Math.pow(1-p,3);
      paint(eased*target);
      if(p<1)requestAnimationFrame(step);else paint(target);
    };
    requestAnimationFrame(step);
  });
}
function animateArcs(root){
  const scoped=!!root;
  (root||document).querySelectorAll('.donut-arc[data-len]').forEach(el=>{
    if(!scoped&&el.closest('.scroll-anim'))return;
    const target=+el.dataset.len,C=+el.dataset.c,delay=+el.dataset.delay||0;
    if(!isFinite(target))return;
    setTimeout(()=>{
      const dur=1200,start=performance.now();
      const step=now=>{
        const p=Math.min(1,(now-start)/dur);
        const eased=1-Math.pow(1-p,3);
        el.setAttribute('stroke-dasharray',`${Math.max(0,eased*target)} ${C}`);
        if(p<1)requestAnimationFrame(step);
      };
      requestAnimationFrame(step);
    },delay);
  });
}
/* Setup performance / Most traded / Win-loss donut / Day-wise cards: bars, numbers and the donut
   only animate once the card scrolls into view, not the moment the page renders. */
function setupScrollReveal(){
  document.querySelectorAll('.scroll-anim').forEach(card=>{
    const io=new IntersectionObserver((entries,obs)=>{
      entries.forEach(entry=>{
        if(!entry.isIntersecting)return;
        entry.target.classList.add('in-view');
        animateCountUp(entry.target);
        animateArcs(entry.target);
        obs.unobserve(entry.target);
      });
    },{threshold:0.2});
    io.observe(card);
  });
}

/* Script-free Google login (works in every browser): goes straight to Google and comes back with a Google ID token */
function gKeep(k,v){try{localStorage.setItem(k,v)}catch(e){try{sessionStorage.setItem(k,v)}catch(e2){}}}
function gTake(k){let v=null;try{v=localStorage.getItem(k);localStorage.removeItem(k)}catch(e){}if(v===null){try{v=sessionStorage.getItem(k);sessionStorage.removeItem(k)}catch(e){}}return v}
function gRand(){const a=new Uint8Array(16);crypto.getRandomValues(a);return Array.from(a).map(x=>x.toString(16).padStart(2,'0')).join('')}
async function signInWithGoogle(){
  if(!sb){S.error='App could not connect. Please reload';return render();}
  S.error='';S.busy='Opening Google login';render();
  try{
    const raw=gRand(),st=gRand();
    gKeep('g_nonce',raw);gKeep('g_state',st);
    const d=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(raw));
    const hashed=Array.from(new Uint8Array(d)).map(x=>x.toString(16).padStart(2,'0')).join('');
    window.location.href='https://accounts.google.com/o/oauth2/v2/auth?client_id='+encodeURIComponent(GOOGLE_CLIENT_ID)
      +'&redirect_uri='+encodeURIComponent(window.location.origin+'/')
      +'&response_type=id_token&scope='+encodeURIComponent('openid email profile')
      +'&nonce='+hashed+'&state='+st+'&prompt=select_account';
  }catch(e){S.busy=null;S.error=friendlyError(e);render();}
}
/* When Google sends the person back with an ID token in the address, finish the login */
async function handleGoogleReturn(){
  try{
    const h=window.location.hash||'';
    if(h.indexOf('id_token=')<0)return;
    const p=new URLSearchParams(h.replace(/^#/,''));
    const idt=p.get('id_token'),st=p.get('state');
    try{history.replaceState(null,'',window.location.pathname+window.location.search)}catch(e){}
    const okSt=gTake('g_state'),raw=gTake('g_nonce');
    if(!idt||!st||st!==okSt||!raw){S.error='Google login could not be verified. Please try again';return;}
    const {data,error}=await sb.auth.signInWithIdToken({provider:'google',token:idt,nonce:raw});
    if(error){S.error=friendlyError(error);return;}
    let u=data&&data.user;
    try{const ud=await sb.auth.getUser();if(ud&&ud.data&&ud.data.user)u=ud.data.user}catch(e){}
    const ids=(u&&u.identities)||[];
    const em=ids.find(x=>x.provider==='email'),go=ids.find(x=>x.provider==='google');
    if(em&&go&&em.created_at&&go.created_at&&new Date(em.created_at)<new Date(go.created_at)){
      try{await sb.auth.signOut({scope:'local'})}catch(e){console.error(e)}
      S.authMode='login';S.error=MSG_EMAIL_ACCOUNT;
    }
  }catch(e){console.error(e);S.error=friendlyError(e)}
}
async function submitAuth(){
  if(!sb){S.error='App could not connect. Please reload';return render();}
  const f=S.form;
  try{
    if(S.authMode==='login'){
      if(!f.email||!f.password){S.error='Enter your email and password';return render()}
      S.error='';S.busy='Logging in';render();
      const {data,error}=await sb.auth.signInWithPassword({email:f.email.trim().toLowerCase(),password:f.password});
      if(error){S.busy=null;S.error=friendlyError(error);return render()}
      await loadAll(data.session);
      S.form={};S.tab='dashboard';S.busy=null;render(true);
      return;
    }
    if(!f.first||!f.last||!f.gender||!f.password||!f.confirm){S.error='Fill in all the required fields';return render()}
    if(!/^\S+@\S+\.\S+$/.test(f.email||'')){S.error='Enter a valid email address';return render()}
    if(f.password.length<8){S.error='Password needs at least 8 characters';return render()}
    if(f.password!==f.confirm){S.error='Passwords do not match';return render()}
    S.error='';S.busy='Creating your account';render();
    const {data,error}=await sb.auth.signUp({
      email:f.email.trim().toLowerCase(),password:f.password,
      options:{
        data:{first_name:f.first.trim(),last_name:f.last.trim(),gender:f.gender,dob:f.dob||''},
        emailRedirectTo:window.location.href.split('#')[0].split('?')[0]
      }
    });
    if(error){S.busy=null;S.error=friendlyError(error);return render()}
    if(!data.session){
      S.busy=null;S.authMode='login';S.form={email:f.email.trim().toLowerCase()};
      S.error='Account created. Check your email and click the confirmation link before logging in.';return render(true);
    }
    await loadAll(data.session);
    S.form={};S.tab='dashboard';S.busy=null;render(true);
  }catch(e){
    console.error(e);S.busy=null;S.error=friendlyError(e);render();
  }
}
const PENDING_KEY='syt-broker-pending';

const BROKER_RETURN=(()=>{

  try{
    const q=new URLSearchParams(window.location.search);
    BROKERS.forEach(b=>{const k=b.toLowerCase().replace(/\s+/g,'');if(q.has(k)){name=b;result=String(q.get(k)||'').toLowerCase();q.delete(k)}});
    if(name){const rest=q.toString();history.replaceState(null,'',window.location.pathname+(rest?'?'+rest:'')+window.location.hash)}
  }catch(e){}
  try{
    const pend=JSON.parse(safeStorage.getItem(PENDING_KEY)||'null');
    safeStorage.removeItem(PENDING_KEY);
    if(!name&&pend&&pend.b&&Date.now()-pend.t<30*60*1000)name=pend.b;
  }catch(e){}
  return name?{broker:name,result}:null;
})();

async function handleBrokerReturn(){

async function saveProfile(){
  const d=S.draft;
  if(!d.first||!d.last){S.error='Fill in all the required fields';return render()}
  S.busy='Saving';render();
  const upd={first_name:d.first.trim(),last_name:d.last.trim(),dob:d.dob||null};
  if(S.profHasGender)upd.gender=d.gender||null;
  const {error}=await sb.from('profiles').update(upd).eq('id',S.user.id);
  S.busy=null;
  if(error){S.error=friendlyError(error);return render()}
  try{await sb.auth.updateUser({data:{first_name:d.first.trim(),last_name:d.last.trim(),gender:d.gender||'',dob:d.dob||''}})}catch(e){console.error(e)}
  S.user={...S.user,first:d.first.trim(),last:d.last.trim(),gender:d.gender||'',dob:d.dob||''};S.acct=S.user;

async function saveEmail(){
  const e=S.em;const nw=(e.nw||'').trim().toLowerCase();
  if(!nw||!e.pw){S.error='Fill in all the fields';return render()}
  if(!/^\S+@\S+\.\S+$/.test(nw)){S.error='Enter a valid email address';return render()}
  if(nw===String(S.user.email||'').toLowerCase()){S.error='New email must be different from your current email';return render()}
  S.error='';S.busy='Sending email';render();
  try{
    const chk=await sb.auth.signInWithPassword({email:S.user.email,password:e.pw});
    if(chk.error){S.busy=null;S.error=/invalid login|credentials/i.test(chk.error.message||'')?'Password is wrong':friendlyError(chk.error);return render()}
    const up=await sb.auth.updateUser({email:nw},{emailRedirectTo:window.location.href.split('#')[0].split('?')[0]});
    S.busy=null;
    if(up.error){S.error=/already|registered|exists/i.test(up.error.message||'')?'This email is already used by another account':friendlyError(up.error);return render()}
    S.em={nw:'',pw:''};S.emSent=nw;render(true);
  }catch(err){S.busy=null;S.error=friendlyError(err);render()}
}
async function savePassword(){
  const p=S.pw;
  if(!p.cur||!p.nw||!p.cf){S.error='Fill in all the fields';return render()}
  if(p.nw.length<8){S.error='New password needs at least 8 characters';return render()}
  if(p.nw===p.cur){S.error='New password must be different from the current one';return render()}
  if(p.nw!==p.cf){S.error='New passwords do not match';return render()}
  S.error='';S.busy='Updating password';render();
  const chk=await sb.auth.signInWithPassword({email:S.user.email,password:p.cur});
  if(chk.error){S.busy=null;S.error='Current password is wrong';return render()}
  const up=await sb.auth.updateUser({password:p.nw});
  S.busy=null;
  if(up.error){S.error=friendlyError(up.error);return render()}
  S.pw={cur:'',nw:'',cf:''};S.sub='profile';render(true);toast('Password updated');
}
async function saveTrade(){
  const t=S.trades.find(x=>x.id===S.editId);const d=S.draft;
  const num=v=>(v===''||v===null||v===undefined||isNaN(+v))?null:+v;
  const row={setup:d.setup||null,planned_sl:num(d.sl),planned_target:num(d.target),
    anticipation:d.anticipation||'no',rule_break:d.ruleBreak||'no',over_trading:d.overTrading||'no',revenge:d.revenge||'no',
    mistake:d.mistake||null,note:d.note||null};
  const md=d.maintain||'yes';
  if(!S.noMD)row.maintain_discipline=md;
  const manual=t.source==='manual';
  if(manual){
    if(!d.broker||!(d.scripName||'').trim()||num(d.entry)===null||num(d.exit)===null||num(d.qty)===null||!d.date){toast('Please fill broker, scrip name, entry, exit, quantity and date');return}
    Object.assign(row,{broker:d.broker,scrip_name:d.scripName.trim(),side:d.side||'buy',entry_price:num(d.entry),exit_price:num(d.exit),qty:num(d.qty),trade_date:d.date,trade_time:d.time||null});
  }
  S.busy='Saving';render();
  if(S.draftShotBlob){
    const path=`${S.user.id}/${S.editId}-${Date.now()}.jpg`;
    const {error:upErr}=await sb.storage.from('screenshots').upload(path,S.draftShotBlob,{contentType:'image/jpeg',upsert:false});
    if(upErr){S.busy=null;toast('Could not upload screenshot. Try again');return render()}
    row.screenshot_url=path;
  }
  let {data:upd,error}=await sb.from('trades').update(row).eq('id',S.editId).select('id');
  let mdSkipped=false;
  if(error&&row.maintain_discipline!==undefined&&(error.code==='42501'||/permission denied/i.test(error.message||''))){
    /* database has no permission for the new column yet: save everything else so the user is never blocked */
    delete row.maintain_discipline;
    ({data:upd,error}=await sb.from('trades').update(row).eq('id',S.editId).select('id'));
    if(!error&&upd&&upd.length){S.noMD=true;mdSkipped=true}
  }
  S.busy=null;
  if(error||!upd||!upd.length){toast('Could not save: '+(error?(error.message||'error'):'no permission to update'));return render()}
  if(S.draftShotUrl){URL.revokeObjectURL(S.draftShotUrl);S.draftShotUrl=null;}
  S.draftShotBlob=null;
  Object.assign(t,{setup:d.setup,sl:d.sl,target:d.target,anticipation:d.anticipation,ruleBreak:d.ruleBreak,overTrading:d.overTrading,revenge:d.revenge,maintain:S.noMD?d.maintain:md,mistake:d.mistake,note:d.note});
  if(manual){
    Object.assign(t,{broker:d.broker,scripName:d.scripName.trim(),side:d.side||'buy',entry:+d.entry,exit:+d.exit,qty:+d.qty,date:d.date,time:d.time||''});
    S.trades.sort((a,b)=>(a.date<b.date?1:a.date>b.date?-1:0)||(String(a.time)<String(b.time)?1:String(a.time)>String(b.time)?-1:0)||(b.id-a.id));
  }
  S.sub=null;render(true);toast(mdSkipped?'Saved. Maintain discipline is not available yet':manual?'Trade saved':'Journal saved');
}
/* Delete a trade. Only manual trades can be deleted; auto-fetched broker trades never can
   (checked here in the app, and again in the database). */
async function deleteManualTrade(){
  const t=S.trades.find(x=>x.id===S.editId);
  S.delModal=false;
  if(!t||t.source!=='manual'){return render()}
  S.busy='Deleting';render();
  let path=null;
  try{const r=await sb.from('trades').select('screenshot_url').eq('id',t.id).maybeSingle();path=r.data&&r.data.screenshot_url}catch(e){}
  const {data,error}=await sb.from('trades').delete().eq('id',t.id).eq('source','manual').select('id');
  S.busy=null;
  if(error||!data||!data.length){toast('Could not delete: '+(error?(error.message||'error'):'no permission to delete'));return render()}
  if(path){try{await sb.storage.from('screenshots').remove([path])}catch(e){}}
  S.trades=S.trades.filter(x=>x.id!==t.id);
  S.editId=null;S.sub=null;render(true);toast('Trade deleted');
}
/* Manual trade entry. Inserted with source:'manual' so it is entirely separate from
   broker-synced rows: loadTrades()/sync never write here, and the auto-fetch trades
   this app pulls from the broker are never edited or touched by this flow. */
async function saveManualTrade(){
  const m=S.mform;
  const num=v=>(v===''||v===null||v===undefined||isNaN(+v))?null:+v;
  if(!m.broker||!(m.scripName||'').trim()||num(m.entry)===null||num(m.exit)===null||num(m.qty)===null||!m.date){
    S.error='Please fill broker, scrip name, entry, exit, quantity and date';return render();
  }
  S.error='';S.busy='Saving';render();
  const row={
    user_id:S.user.id, source:'manual', broker:m.broker, scrip_name:m.scripName.trim(),
    side:m.side||'buy', entry_price:num(m.entry), exit_price:num(m.exit), qty:num(m.qty),
    trade_date:m.date, trade_time:m.time||null
  };
  const {data,error}=await sb.from('trades').insert(row).select(TRADE_COLS).maybeSingle();
  S.busy=null;
  if(error){toast('Could not save. Try again');return render()}
  S.trades.unshift(dbToTrade(data));
  S.mform={};S.sub=null;render(true);toast('Trade added');
}

function canvasToBlob(c,type,q){return new Promise(res=>c.toBlob(res,type,q));}
/* Fit under a size cap while keeping screenshots readable: JPEG quality is
   only ever stepped down to a high floor (0.75), never crushed. If that is
   not enough to fit the cap, the image is redrawn smaller and quality
   is retried from the top, so most of the shrinking comes from resolution,
   not from harsh compression artefacts. Returns a Blob (not a data URL)
   so it can be uploaded to Storage directly. */
async function compressShot(file){
  const maxDim=1280,minDim=480,maxBytes=150*1024,minQuality=0.75,qStep=0.05;
  const dataUrl=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file);});
  const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=dataUrl;});
  let dim=Math.min(maxDim,Math.max(img.width,img.height));
  let blob=null;
  for(let pass=0;pass<8;pass++){
    const k=Math.min(1,dim/Math.max(img.width,img.height));
    const c=document.createElement('canvas');
    c.width=Math.max(1,Math.round(img.width*k));c.height=Math.max(1,Math.round(img.height*k));
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    let q=0.9;blob=await canvasToBlob(c,'image/jpeg',q);
    while(blob.size>maxBytes&&q>minQuality){q=Math.max(minQuality,q-qStep);blob=await canvasToBlob(c,'image/jpeg',q);}
    if(blob.size<=maxBytes||dim<=minDim)break;
    dim=Math.max(minDim,Math.round(dim*0.85));
  }
  return blob;
}
